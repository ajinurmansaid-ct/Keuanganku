<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="coinGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadowMask" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Full bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Center contained graphic within safe area -->
  <g filter="url(#shadowMask)" transform="translate(106, 122)">
    <rect x="0" y="60" width="300" height="200" rx="42" fill="#FFFFFF" />
    <path d="M0,102 C0,78 20,60 42,60 L258,60 C280,60 300,78 300,102 L300,122 L0,122 Z" fill="#E2E8F0" />
    <rect x="200" y="126" width="100" height="66" rx="20" fill="#047857" />
    <circle cx="236" cy="159" r="10" fill="#FCD34D" />

    <g transform="translate(90, -28)">
      <circle cx="60" cy="60" r="56" fill="url(#coinGradMask)" stroke="#B45309" stroke-width="4.5" />
      <circle cx="60" cy="60" r="42" fill="none" stroke="#FEF3C7" stroke-width="3.5" stroke-dasharray="7,5" />
      <text x="60" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#78350F" text-anchor="middle">Rp</text>
    </g>

    <path d="M50,202 L104,148 L138,172 L196,110" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="172,110 196,110 196,134" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
