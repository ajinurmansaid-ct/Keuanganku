<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="coinGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow512" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />

  <!-- Inner border highlight -->
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#34D399" stroke-width="4" stroke-opacity="0.4" />

  <!-- Main Financial Graphic -->
  <g filter="url(#shadow512)" transform="translate(86, 102)">
    <!-- Wallet / Vault Body -->
    <rect x="0" y="70" width="340" height="224" rx="48" fill="#FFFFFF" />
    
    <!-- Wallet Flap Accent -->
    <path d="M0,118 C0,92 22,70 48,70 L292,70 C318,70 340,92 340,118 L340,140 L0,140 Z" fill="#E2E8F0" />
    
    <!-- Wallet Clasp / Badge -->
    <rect x="230" y="144" width="110" height="74" rx="22" fill="#047857" />
    <circle cx="268" cy="181" r="12" fill="#FCD34D" />

    <!-- Coin Rising from Top -->
    <g transform="translate(102, -32)">
      <circle cx="68" cy="68" r="64" fill="url(#coinGrad512)" stroke="#B45309" stroke-width="5" />
      <circle cx="68" cy="68" r="48" fill="none" stroke="#FEF3C7" stroke-width="4" stroke-dasharray="8,6" />
      <!-- Currency Rp symbol -->
      <text x="68" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#78350F" text-anchor="middle">Rp</text>
    </g>

    <!-- Upward Trend Chart Arrow -->
    <path d="M58,230 L118,170 L156,196 L220,126" fill="none" stroke="#10B981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="194,126 220,126 220,152" fill="none" stroke="#10B981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
